# Live pilot against an OpenAI-compatible endpoint configured through
# AGENT_MODEL_BASE_URL and AGENT_MODEL_API_KEY. The model is pinned here and
# overrides AGENT_MODEL_NAME. Held-out family only (10 tasks), two runs, all
# four arms, hard caps below. Episode caps are unchanged from the version
# frozen on 2026-11-09; model and prices were filled in before the first run.
mode: live
model: openai/gpt-4.1-mini        # via OpenRouter, chosen 2026-11-09
families:
  heldout:
    corpus: tests/fixtures/corpus/heldout
    questions: tests/fixtures/questions_heldout.json
    gold: evaluator/gold_heldout.json
arms: [lexical, single_call, agent, agent_no_expand]
runs: 2
episode:
  max_steps: 16
  max_tool_calls: 10
  max_tokens_per_episode: 40000   # prompt plus completion, per agent episode
  max_wall_seconds: 300           # per agent episode
  recent_k: 4
  max_completion_tokens: 700
single_call_top_k: 4
single_call_max_completion_tokens: 900
lexical_coverage_threshold: 0.5
run_caps:
  max_total_tokens: 1500000       # whole evaluation run; later episodes are recorded as failed
  max_usd: 5.0                    # checked before every episode at the prices below
  usd_per_mtok_input: 0.40        # OpenRouter listed price, 2026-11-09
  usd_per_mtok_output: 1.60
output_dir: reports/live
record_timing: true
