[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger-agent"
version = "0.2.0"
description = "Auditable evidence agent: LLM-chosen searches and span reads over a local corpus, hash-verified quotes, and abstention when support is inadequate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aamir Malik" }]
keywords = ["llm-agents", "retrieval", "citation-verification", "evaluation", "materials-science"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[project.scripts]
evidence-ledger-agent = "evidence_ledger_agent.__main__:main"

[project.urls]
Repository = "https://github.com/aamirmalik-dr/evidence-ledger-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_heldout_v2.py" = ["E501"]  # corpus text: long prose strings are data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
